# Workstation ROI zones — polygons in normalized image coordinates [0.0–1.0]
# Origin: top-left. Format: [[x, y], ...] clockwise.
# Draw/adjust after capturing a still frame from each camera's sub-stream.

version: "1.0"
coordinate_space: normalized_frame  # independent of resolution

zones:
  - id: ws-assembly-1
    name: "Workstation Assembly 1"
    camera_id: cam-01
    enabled: true
    expected_occupancy: 1
    polygon:
      - [0.05, 0.35]
      - [0.48, 0.35]
      - [0.48, 0.95]
      - [0.05, 0.95]
    notes: "Left half of cam-01. Replace polygon after floor walkthrough."

